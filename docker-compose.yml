# Swarm ignores env_file. The .env config is uploaded at deploy time
# and bun/next load it from disk. Create the overlay once, then deploy:
#   ./scripts/deploy-swarm.sh
#   ./scripts/deploy-swarm.sh --frontend
#   docker network create -d overlay --attachable sparkvey_net
#   docker stack deploy -c docker-compose.yml sparkvey

configs:
  sparkvey_env:
    file: .env
    # Swarm configs are immutable. The deploy script sets this to sparkvey_env_<hash>.
    name: ${SPARKVEY_ENV_CONFIG:-sparkvey_env}

volumes:
  # Node-local. Keep both nextjs tasks on the same machine (single-node
  # swarm, or pin them) so they actually share hashed CSS/JS.
  # The nextjs entrypoint keeps the last NEXT_STATIC_KEEP_BUILDS builds
  # (default 3) and deletes files no remaining build still serves.
  next_static:

networks:
  app:
    external: true
    name: sparkvey_net

services:
  backend:
    image: sparkvey-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
    command: ["bun", "--env-file=/run/sparkvey.env", "app.ts"]
    configs:
      - source: sparkvey_env
        target: /run/sparkvey.env
        uid: "1000"
        gid: "1000"
        mode: 0444
    ports:
      - "8080:8080"
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||'8080')+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s

  worker:
    image: sparkvey-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    command: ["bun", "--env-file=/run/sparkvey.env", "./backend/workers/index.ts"]
    configs:
      - source: sparkvey_env
        target: /run/sparkvey.env
        uid: "1000"
        gid: "1000"
        mode: 0444
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s

  nextjs:
    image: sparkvey-nextjs:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: nextjs
      args:
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        NEXT_PUBLIC_CF_BEACON_TOKEN: ${NEXT_PUBLIC_CF_BEACON_TOKEN:-}
    env_file:
      - .env
    environment:
      NEXT_STATIC_KEEP_BUILDS: ${NEXT_STATIC_KEEP_BUILDS:-3}
    configs:
      - source: sparkvey_env
        target: /app/.env
        mode: 0444
    ports:
      - "4000:4000"
    volumes:
      - next_static:/mnt/next-static
    networks:
      - app
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
