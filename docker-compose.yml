services:
  backend:
    image: sparkvey-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||'8080')+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: sparkvey-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 30s

  nextjs:
    image: sparkvey-nextjs:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: nextjs
      args:
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        NEXT_PUBLIC_CF_BEACON_TOKEN: ${NEXT_PUBLIC_CF_BEACON_TOKEN:-}
    env_file:
      - .env
    ports:
      - "4000:4000"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
