# stack deploy interpolates ${VAR} from the shell or --env-file.
# env_file is used by `docker compose up` only.

x-sparkvey-environment: &sparkvey-environment
  NODE_ENV: production
  PORT: ${PORT:-8080}
  MONGODB_URI: ${MONGODB_URI:?}
  MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:?}
  REDIS_URI: ${REDIS_URI:?}
  DOMAINS: ${DOMAINS:?}
  BACKEND_URL: ${BACKEND_URL:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  NEXTJS_PASSTHROUGH_TOKEN: ${NEXTJS_PASSTHROUGH_TOKEN:-}
  EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LOOTABLY_API_KEY: ${LOOTABLY_API_KEY:-}
  LOOTABLY_PLACEMENT_ID: ${LOOTABLY_PLACEMENT_ID:-}
  AYET_API_KEY: ${AYET_API_KEY:-}
  AYET_PLACEMENT_ID: ${AYET_PLACEMENT_ID:-}
  FASTASK_API_KEY: ${FASTASK_API_KEY:-}
  AYETSTUDIOS_POSTBACK_SECRET: ${AYETSTUDIOS_POSTBACK_SECRET:-}
  LOOTABLY_POSTBACK_SECRET: ${LOOTABLY_POSTBACK_SECRET:-}
  ADTOWALL_POSTBACK_SECRET: ${ADTOWALL_POSTBACK_SECRET:-}
  TOROX_PLACEMENT_ID: ${TOROX_PLACEMENT_ID:-}
  TOROX_APP_TOKEN: ${TOROX_APP_TOKEN:-}
  MONLIX_POSTBACK_SECRET: ${MONLIX_POSTBACK_SECRET:-}
  HANGMYADS_POSTBACK_SECRET: ${HANGMYADS_POSTBACK_SECRET:-}
  HANGMYADS_RATE: ${HANGMYADS_RATE:-}
  PLAYFINA_POSTBACK_SECRET: ${PLAYFINA_POSTBACK_SECRET:-}
  AFFILIRISE_POSTBACK_SECRET: ${AFFILIRISE_POSTBACK_SECRET:-}
  KONG_POSTBACK_SECRET: ${KONG_POSTBACK_SECRET:-}
  BITSTARZ_POSTBACK_SECRET: ${BITSTARZ_POSTBACK_SECRET:-}
  PLAYID_POSTBACK_SECRET: ${PLAYID_POSTBACK_SECRET:-}
  CPX_APP_ID: ${CPX_APP_ID:-}
  CPX_SECURE_HASH: ${CPX_SECURE_HASH:-}
  TREMENDOUS_API_KEY: ${TREMENDOUS_API_KEY:-}
  TREMENDOUS_CAMPAIGN_ID: ${TREMENDOUS_CAMPAIGN_ID:-}
  CCPAYMENT_APP_ID: ${CCPAYMENT_APP_ID:-}
  CCPAYMENT_APP_SECRET: ${CCPAYMENT_APP_SECRET:-}
  PROXYDETECT_WEBHOOK_SECRET: ${PROXYDETECT_WEBHOOK_SECRET:-}
  NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
  NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
  NEXT_PUBLIC_CF_BEACON_TOKEN: ${NEXT_PUBLIC_CF_BEACON_TOKEN:-}
  VERISOUL_PROJECT_ID: ${VERISOUL_PROJECT_ID:-}

services:
  backend:
    image: sparkvey-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    env_file:
      - .env
    environment:
      <<: *sparkvey-environment
    ports:
      - "8080:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||'8080')+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  worker:
    image: sparkvey-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      <<: *sparkvey-environment
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 10s
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nextjs:
    image: sparkvey-nextjs:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: nextjs
      args:
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        NEXT_PUBLIC_CF_BEACON_TOKEN: ${NEXT_PUBLIC_CF_BEACON_TOKEN:-}
    env_file:
      - .env
    environment:
      <<: *sparkvey-environment
    ports:
      - "4000:4000"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
